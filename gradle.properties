group=io.github.uoooo
# Base development version. Released artifacts get -K<kotlin-version>
# appended per variant by the release workflow (-Pversion=...); local
# builds select a variant's dependencies with -PkotlinVariant=<kotlin>.
version=0.1.0-SNAPSHOT

kotlin.code.style=official

android.useAndroidX=true
android.disableAgpUpgradePrompt=true

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
