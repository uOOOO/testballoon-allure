name: Release

# Manually triggered from the Actions UI: pick a v* base-version tag as
# the ref (v0.1.0 -> 0.1.0). Each matrix job tests and uploads one Kotlin
# variant as <base>-K<kotlin>. Uploads only: deployments are published in
# the Central Portal afterwards, oldest Kotlin first, newest last.
on:
  workflow_dispatch:

jobs:
  version:
    name: Derive the base version from the selected tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this workflow from a v* tag (selected ref: $GITHUB_REF)"; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *SNAPSHOT*) echo "::error::SNAPSHOT versions are not releasable: $version"; exit 1 ;;
            *-K*) echo "::error::Tag the base version without a -K suffix: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  lint:
    name: Lint
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Lint
        run: ./gradlew lintKotlin

  publish:
    name: Publish K${{ matrix.kotlin }}
    needs: [version, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kotlin: ['2.2.0', '2.2.21', '2.3.0', '2.3.20', '2.4.0']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Test the variant
        run: >
          ./gradlew -PkotlinVariant=${{ matrix.kotlin }}
          :testballoon-allure:jvmTest
          :testballoon-allure-android:testAndroidHostTest

      - name: Publish the variant
        run: >
          ./gradlew publishToMavenCentral
          -PkotlinVariant=${{ matrix.kotlin }}
          -Pversion=${{ needs.version.outputs.version }}-K${{ matrix.kotlin }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
